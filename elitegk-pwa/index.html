function build(){const p=prof||(prof={sport:true,team:[1,4],match:0}),T=p.sport?p.team:[],M=p.sport&&p.match>=0?p.match:-1;

const N=["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];DAY={};PRE=[];POST=[];
for(let d=0;d<7;d++){const n=N[d];let r;

const FIX={c:"Yogurt Greco 2% 170 g + Fiocchi d’avena 40 g + Frutti rossi 50 g (o marmellata s/z 30 g) + Noci/Mandorle 10 g",s:"Frutto di stagione 150 g + 15 g Noci o Mandorle",p:"60 g Pane integrale/segale + 60 g Fesa/Bresaola + 1 bicchiere di succo di amarena concentrato (1,5 h prima)",n:"100 g Yogurt Greco o Fiocchi di latte",l:"300-400 ml di latte al cioccolato parzialmente scremato (dopo ogni sessione)"};

let PRE=[],POST=[];

const LD={1:[q("Pasta/Riso",100,P),q("Legumi (cotti o in barattolo)",140,P),q("Verdura di stagione",300,V),q("Carne bianca",250,C),q("Pane",80,P),q("Olio EVO",30,P),q("Frutta di stagione",300,V)],2:[q("Pasta/Riso",100,P),q("Pesce (azzurro/merluzzo)",200,C),q("Verdura di stagione",350,V),q("Pane",80,P),q("Uova",3,L,"pz"),q("Olio EVO",30,P),q("Frutta di stagione",300,V)],3:[q("Pasta/Riso",100,P),q("Ricotta",150,L),q("Verdura di stagione",400,V),q("Pane",50,P),q("Carne bianca",250,C),q("Olio EVO",30,P),q("Frutta di stagione",300,V)],4:[q("Pasta/Riso",100,P),q("Parmigiano",40,L),q("Verdura di stagione",350,V),q("Patate",200,V),q("Pesce (azzurro/merluzzo)",250,C),q("Olio EVO",30,P),q("Frutta di stagione",300,V)],5:[q("Pasta/Riso",80,P),q("Legumi (cotti o in barattolo)",140,P),q("Verdura di stagione",350,V),q("Pane",80,P),q("Mozzarella",150,L),q("Olio EVO",30,P),q("Frutta di stagione",300,V)],6:[q("Pane",60,P),q("Pesce (azzurro/merluzzo)",250,C),q("Verdura di stagione",150,V),q("Olio EVO",15,P),q("Frutta di stagione",150,V)],0:[q("Pasta/Riso",80,P),q("Carne rossa",200,C),q("Verdura di stagione",350,V),q("Pane",60,P),q("Formaggio spalmabile light",80,L),q("Olio EVO",30,P),q("Frutta di stagione",300,V)]};
function FD(d){const r=[q("Yogurt Greco 2%",270,L),q("Fiocchi d’avena",40,P),q("Frutti rossi surgelati",50,V),q("Noci/Mandorle",25,P),q("Frutta di stagione",150,V)];if(PRE.includes(d))r.push(q("Pane",60,P),q("Fesa/Bresaola",60,C),q("Succo di amarena concentrato",1,P,"bicchiere"));if(POST.includes(d))r.push(q("Latte al cioccolato",350,L,"ml"));return r.concat(LD[d])}
function agg(ds){const m={};ds.forEach(d=>FD(d).forEach(([n,g,u,c])=>{(m[n]=m[n]||[n,0,u,c])[1]+=g}));return Object.values(m)}
const fq2=(g,u)=>u=="g"?(g>=1000?(g/1000).toFixed(1).replace(".",",")+" kg":g+" g"):u=="ml"?(g>=1000?(g/1000).toFixed(1).replace(".",",")+" L":g+" ml"):g+" "+u;
const TIPS="<div class='c m' style='margin-left:0'><b>Risparmio (novembre):</b> frutta: arance, mandarini, mele, pere e kiwi in cassetta o sacchetto. Verdura: finocchi, broccoli, cavolfiore, zucca, spinaci, carote. Frutti rossi sempre surgelati, legumi secchi, pesce azzurro (sgombro, alici) o merluzzo al posto del salmone, yogurt e formaggi in formato famiglia o discount.</div>";
let sm="d";
function shop(){const ds=sm=="d"?[day]:[1,2,3,4,5,6,0],it=agg(ds);return `<div class="sec"><div class="seg"><button class="${sm=="d"?"on":""}" onclick="sm='d';draw(1)">Oggi (${GD[day]})</button><button class="${sm=="w"?"on":""}" onclick="sm='w';draw(1)">Settimana</button></div>`+[V,L,C,P].map(c=>{const r=it.filter(x=>x[3]==c);return r.length?`<h2>${c.toUpperCase()}</h2><div class="c">`+r.map(x=>{const k="sp|"+sm+"|"+(sm=="d"?day+"|":"")+x[0];return `<div class="it ${st.d[k]?"x":""}"><button class="chk ${st.d[k]?"on":""}" onclick="tg('${k}')">${st.d[k]?"✓":""}</button><b>${x[0]}</b><em>${fq2(x[1],x[2])}</em></div>`}).join("")+`</div>`:""}).join("")+TIPS+`<button class="btn g" style="width:100%" onclick="for(const k in st.d)if(k.startsWith('sp|'))delete st.d[k];sv();draw(1)">Azzera spunte spesa</button></div>`}
function cur(){const h=new Date().getHours();return h>=7&&h<10?0:h>=10&&h<12?1:h>=12&&h<15?2:h>=15&&h<18?3:h>=18&&h<22?4:h>=22?5:-1}
function meals2(){const m=ML[day],c=day==new Date().getDay()?cur():-9,pst=POST.includes(day);const S=[["COLAZIONE","7-10",FIX.c],["SPUNTINO","10-12",FIX.s],["PRANZO","12-15",m[0]],["MERENDA","15-18",PRE.includes(day)?FIX.p:"Libera: acqua, tè o caffè. Nessuno spuntino extra oggi."],["CENA","18-22",m[1]+(pst?"<br><b>Post-sessione:</b> "+FIX.l:"")],["POST CENA","22-24",FIX.n]];return `<div class="sec"><h2>${DAY[day][0].toUpperCase()}</h2>`+(c==-1?`<div class="c">🌙 Ora si riposa. Prossimo pasto: colazione alle 7.</div>`:"")+S.map((s,i)=>{const k=K("m"+i+"d"+day);return `<div class="meal2 ${i==c?"now":""}"><div class="r"><button class="chk ${st.d[k]?"on":""}" onclick="tg('${k}')">${st.d[k]?"✓":""}</button><div style="flex:1"><h3>${s[0]} <small>${s[1]}${i==c?" · ADESSO":""}</small></h3><p>${s[2]}</p></div></div></div>`}).join("")+`</div>`}
function work2(){if(!DAY[day][2].length)return `<div class="sec"><div class="c">😴 Giorno di recupero: niente allenamento. Cammina, dormi 8 ore e segui i pasti.</div></div>`;return `<div class="sec"><button class="btn go" onclick="fstart()">▶ Modalità focus · un esercizio alla volta</button></div>`+work()}
function draw(k){head();$("v").innerHTML=tab=="w"?work2():tab=="m"?meals2():tab=="p"?shop():week();if(!k){scrollTo(0,0);if(tab=="m")setTimeout(()=>{const n=document.querySelector(".now");n&&n.scrollIntoView({block:"center",behavior:"smooth"})},80)}}
function tg(k){st.d[k]=!st.d[k];sv();const y=scrollY;draw(1);scrollTo(0,y)}
let fi=0,fx=[],tm=null;
function fstart(){fx=DAY[day][2];fi=Math.max(0,fx.findIndex(e=>!st.d[K(e[0])]));$("fo").classList.add("on");fs()}
function fq(){clearInterval(tm);$("fo").classList.remove("on");draw(1)}
function ss(k,i,b){st.d[k+"s"+i]=!st.d[k+"s"+i];sv();b.classList.toggle("on")}
function fn(){st.d[K(fx[fi][0])]=true;sv();fi++;fs();head()}
function fb(){if(fi>0){fi--;fs()}}
function rt(b){clearInterval(tm);let s=90;b.textContent="⏱ "+s+"”";tm=setInterval(()=>{s--;b.textContent=s>0?"⏱ "+s+"”":"✔ Via!";if(s<=0){clearInterval(tm);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}},1000)}
function fs(){clearInterval(tm);const e=fx[fi];if(!e){$("fo").innerHTML=`<div class="fc"><h1>Allenamento completato 🔥</h1><p class="m" style="margin:0">Ora 300-400 ml di latte al cioccolato.</p><button class="btn" style="border:0" onclick="fq()">Chiudi</button></div>`;return}
const k=K(e[0]),n=Math.max(1,parseInt(e[2])||1),pv=st.l[k.replace(/^\d/,Math.max(1,st.w-1))];
$("fo").innerHTML=`<div class="fh"><button class="g" onclick="fq()">✕</button><div class="dots">${fx.map((_,i)=>`<i class="${i<fi?"p":i==fi?"c":""}"></i>`).join("")}</div><span>${fi+1}/${fx.length}</span></div><div class="fc"><span class="tag">${e[2]}</span><h1>${e[1]}</h1><p class="m" style="margin:0">${e[3]}</p><div class="sds">${Array.from({length:n},(_,i)=>`<button class="sd ${st.d[k+"s"+i]?"on":""}" onclick="ss('${k}',${i},this)">${i+1}</button>`).join("")}</div>`+(e[5]?`<input type="number" inputmode="decimal" placeholder="${pv||"kg"}" value="${st.l[k]||""}" onchange="sl('${k}',this.value)"><span class="m" style="margin:4px 0 0">kg${pv&&st.w>1?" · sett. prec: "+pv:""}</span>`:"")+`</div><div class="fb"><button class="btn g" onclick="fb()">←</button><button class="btn g" onclick="rt(this)">⏱ 90”</button><button class="btn" onclick="fn()">Fatto · Avanti</button></div>`}
const api=(p,m="GET",b)=>fetch("/api/"+p,{method:m,headers:b?{"content-type":"application/json"}:{},body:b?JSON.stringify(b):undefined,credentials:"same-origin"}).then(async r=>({ok:r.ok,s:r.status,d:await r.json().catch(()=>({}))}));
let me=null,prof=null;try{prof=JSON.parse(localStorage.getItem("egkp"))}catch(e){}
const lp=()=>{try{localStorage.setItem("egkp",JSON.stringify(prof))}catch(e){}};
function start(){build();$("au").classList.remove("on");draw()}
async function boot(){try{const r=await api("me");if(r.ok){me=r.d.user;prof=r.d.profile;if(r.d.state&&r.d.state.d)st=r.d.state;else if(me)api("state","PUT",st);lp();try{localStorage.setItem("egk",JSON.stringify(st))}catch(e){}start();return}if(r.s==401){authUI();return}}catch(e){}start()}
function authUI(m="login"){const L=m=="login";$("au").classList.add("on");$("au").innerHTML=`<div class="fc"><span class="tag">ELITE GK</span><h1>${L?"Accedi":"Crea account"}</h1><input id="u" placeholder="Utente" autocapitalize="none" autocomplete="username" style="width:100%;font-size:17px;margin-bottom:10px"><input id="p" type="password" placeholder="Password (min 8)" autocomplete="${L?"current-password":"new-password"}" style="width:100%;font-size:17px">`+(L?"":`<label class="m" style="margin:12px 0 0"><input type="checkbox" id="sp" checked style="width:auto;margin:0 6px 0 0"> Pratico uno sport (futsal). Se togli la spunta: solo dieta e palestra.</label>`)+`<p id="er" class="m" style="color:var(--ac)"></p><button class="btn" style="border:0" onclick="doAuth('${m}')">${L?"Entra":"Registrati"}</button><button class="btn g" onclick="authUI('${L?"reg":"login"}')">${L?"Crea un account":"Ho già un account"}</button></div>`}
async function doAuth(m){const r=await api(m=="login"?"login":"register","POST",{u:$("u").value,p:$("p").value,sport:$("sp")?$("sp").checked:true});if(r.ok){if(m=="reg"){try{localStorage.removeItem("egk");localStorage.removeItem("egkp")}catch(e){}st={w:1,d:{},l:{}}}boot()}else $("er").textContent=r.d.e||"Errore, riprova"}
async function out(){await api("logout","POST");try{localStorage.clear()}catch(e){}location.reload()}
function pv2(){lp();build();if(me)api("profile","PUT",prof);plan();draw(1)}
function pp(v){prof.sport=v;pv2()}
function pt2(d){const t=prof.team,i=t.indexOf(d);if(i>=0)t.splice(i,1);else{t.push(d);if(t.length>2)t.shift()}if(prof.match==d)prof.match=-1;pv2()}
function pm(d){prof.match=d;prof.team=prof.team.filter(x=>x!=d);pv2()}
function plan(){const D=[1,2,3,4,5,6,0],p=prof;$("shc").innerHTML=`<h2>Il mio piano</h2><label class="r" style="margin:8px 0"><input type="checkbox" ${p.sport?"checked":""} onchange="pp(this.checked)" style="width:22px;height:22px"><b>Pratico futsal</b></label>`+(p.sport?`<p class="m" style="margin:8px 0 4px">Allenamenti squadra (max 2)</p><div class="days" style="padding:0">`+D.map(d=>`<div class="d ${p.team.includes(d)?"on":""}" onclick="pt2(${d})">${GD[d]}</div>`).join("")+`</div><p class="m" style="margin:8px 0 4px">Partita</p><div class="days" style="padding:0">`+[-1,...D].map(d=>`<div class="d ${p.match==d?"on":""}" onclick="pm(${d})">${d<0?"Nessuna":GD[d]}</div>`).join("")+`</div><p class="m" style="margin:8px 0 0">Palestra, primer e reset si riposizionano da soli.</p>`:`<p class="m" style="margin:8px 0">Piano solo dieta e palestra.</p>`)+`<a class="btn" href="#" onclick="$('sh').classList.remove('on');return false">Fatto</a>`+(me?`<a class="btn g" href="#" onclick="out();return false">Esci (${me.username})</a>`:"");$("sh").classList.add("on")}
if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
boot();
