<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elite GK</title><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0B1F3A"><link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{color-scheme:light;--bg:#F4F2ED;--card:#FFFFFF;--c2:#F8F6F1;--tx:#0E1B2C;--mu:#5E6878;--bd:#E6E1D7;--trk:#ECE7DD;--ac:#E8590C;--am:#E3A008;--nv:#0B1F3A;--ok:#1F9D55;--okr:31,157,85;--gd:#A07A3F;--sh:0 1px 2px rgba(14,27,44,.04),0 10px 30px rgba(14,27,44,.06);--r:20px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#070F1C;--card:#0E1A2D;--c2:#122139;--tx:#EDF1F7;--mu:#8FA0B6;--bd:#1B2B44;--trk:#1A2A42;--ok:#2BB673;--okr:43,182,115;--gd:#CDA86C;--sh:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#070F1C;--card:#0E1A2D;--c2:#122139;--tx:#EDF1F7;--mu:#8FA0B6;--bd:#1B2B44;--trk:#1A2A42;--ok:#2BB673;--okr:43,182,115;--gd:#CDA86C;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 calc(104px + env(safe-area-inset-bottom,0));-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:0 16px}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 0 6px}
.hd h1{margin:2px 0 0;font-size:28px;line-height:1.1;letter-spacing:-.02em;font-weight:800}
.ey{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:700}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;flex:0 0 auto;box-shadow:var(--sh)}
.ib svg{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--tx)}
.pill.gd{color:var(--gd);border-color:color-mix(in srgb,var(--gd) 35%,var(--bd))}
.row{display:flex;align-items:center;gap:10px}.f1{flex:1;min-width:0}
.mu{color:var(--mu)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--sh)}
.card h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ch span{color:var(--mu);font-size:13px;font-weight:700}
.lk{background:none;border:0;color:var(--ac);font-weight:800;font-size:13px;padding:4px 0}
/* hero */
.now{position:relative;overflow:hidden;border-radius:24px;padding:20px;margin:12px 0;color:#fff;background:linear-gradient(150deg,#0B1F3A 0%,#17406D 100%);box-shadow:0 14px 34px rgba(11,31,58,.28)}
.now.hot{background:linear-gradient(150deg,#E8590C 0%,#B83E06 100%);box-shadow:0 14px 34px rgba(232,89,12,.32)}
.now.night{background:linear-gradient(150deg,#0B1226 0%,#2A2F66 100%)}
.now.ok{background:linear-gradient(150deg,#14653A 0%,#1F9D55 100%)}
.now::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%)}
.now .ey{color:rgba(255,255,255,.7)}
.now .nw{display:flex;gap:14px;align-items:flex-start;margin-top:10px}
.now .ne{font-size:34px;line-height:1}
.now h2{margin:0;font-size:22px;line-height:1.2;letter-spacing:-.01em}
.now p{margin:6px 0 0;color:rgba(255,255,255,.82);font-size:14.5px}
.now .kc{display:inline-block;margin-top:8px;background:rgba(255,255,255,.16);border-radius:8px;padding:2px 8px;font-size:12.5px;font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:16px;text-align:center;background:var(--ac);color:#fff;text-decoration:none;margin-top:14px;min-height:50px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.now .btn{background:#fff;color:#0B1F3A}
.btn.g{background:var(--c2);color:var(--tx);border:1px solid var(--bd)}
.btn.sm{padding:10px 12px;font-size:14px;min-height:42px;margin-top:10px}
.also{display:grid;gap:8px}
.al{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;text-align:left;width:100%;box-shadow:var(--sh)}
.al .ne{font-size:22px}.al .f1{min-width:0}.al{overflow:hidden}.al b{display:block;font-size:14.5px}.al small{display:block;color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al .go{color:var(--ac);font-weight:800;font-size:13px;white-space:nowrap}
/* rings + summary */
.rw{position:relative;display:inline-grid;place-items:center}.rw>span{position:absolute;text-align:center;line-height:1.05}
.rg circle{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.sum{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.sum .big b{display:block;font-size:26px;font-weight:800}.sum .big small{font-size:10.5px;color:var(--mu);font-weight:700;letter-spacing:.08em}
.mets{display:grid;grid-template-columns:1fr;gap:8px}
.met{display:flex;align-items:center;gap:8px;min-width:0}.met>div{min-width:0}.met b{display:block;font-size:14px}.met small{display:block;color:var(--mu);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;background:var(--trk);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .5s}
.bar.ac i{background:var(--ac)}.bar.over i{background:var(--am)}
/* habits */
.hab{display:grid;gap:8px}
.hb{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--bd);background:var(--c2);border-radius:14px;padding:11px 12px;text-align:left;min-height:50px;transition:background .2s,border-color .2s}
.hb .hi{font-size:20px;width:26px;text-align:center}.hb span.f1{font-weight:600;font-size:15px}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;flex:0 0 auto;color:#fff;font-size:14px;font-weight:900;background:transparent;transition:all .2s}
.on>.ck,.ck.on{background:var(--ok);border-color:var(--ok);animation:pop .3s}
.hb.on{border-color:color-mix(in srgb,var(--ok) 45%,var(--bd));background:color-mix(in srgb,var(--ok) 9%,var(--card))}
.hb.on span.f1{color:var(--mu);text-decoration:line-through;text-decoration-thickness:1px}
/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}.tl li:first-child{border-top:0}
.tl li>div{min-width:0}.tl time{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}.tl b{font-size:14.5px}.tl small{display:block;color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* quote + lesson */
.qt{margin:16px 0;padding:22px 20px;border-radius:var(--r);background:var(--c2);border:1px solid var(--bd);position:relative}
.qt::before{content:"“";position:absolute;left:14px;top:-6px;font:700 72px/1 Georgia,serif;color:var(--gd);opacity:.35}
.qt blockquote{margin:6px 0 0;font:italic 20px/1.4 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;letter-spacing:-.005em}
.qt cite{display:block;margin-top:12px;font-style:normal;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gd);font-weight:800}
.ls .ey{color:var(--gd)}.ls h3{font-size:19px;margin:4px 0 8px;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.ls p{margin:0 0 10px;font-size:15px}
.pr{background:color-mix(in srgb,var(--gd) 10%,var(--card));border:1px solid color-mix(in srgb,var(--gd) 30%,var(--bd));border-radius:14px;padding:12px}
.pr b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gd);margin-bottom:3px}
/* day strip */
.ds{display:flex;gap:6px;overflow-x:auto;margin:8px -16px 4px;padding:4px 16px;scrollbar-width:none}.ds::-webkit-scrollbar{display:none}
.dp{flex:1 0 44px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;border:1px solid var(--bd);background:var(--card);min-height:62px}
.dp small{font-size:11px;color:var(--mu);font-weight:700}.dp b{font-size:17px}.dp i{width:6px;height:6px;border-radius:50%;background:transparent}
.dp.td{border-color:var(--tx)}.dp.on{background:var(--nv);border-color:var(--nv);color:#fff}.dp.on small{color:rgba(255,255,255,.7)}
:root[data-theme="dark"] .dp.on{background:#EDF1F7;color:#0B1F3A;border-color:#EDF1F7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dp.on{background:#EDF1F7;color:#0B1F3A;border-color:#EDF1F7}:root:not([data-theme="light"]) .dp.on small{color:#5E6878}}
:root[data-theme="dark"] .dp.on small{color:#5E6878}
/* exercises */
.dh{display:flex;gap:14px;align-items:center}
.kb{display:inline-block;border-radius:8px;padding:2px 8px;font-size:11.5px;font-weight:800;letter-spacing:.04em;color:#fff}
.ex{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0;box-shadow:var(--sh);transition:opacity .2s,border-color .2s}
.ex.dn{border-color:color-mix(in srgb,var(--ok) 50%,var(--bd))}.ex.dn .en{color:var(--mu);text-decoration:line-through;text-decoration-thickness:1px}
.ex .en{font-weight:700;font-size:15.5px}
.tg{display:inline-block;background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac);border-radius:7px;padding:1px 7px;font-size:12.5px;font-weight:800;margin-right:4px}
.ed{margin:8px 0 0 38px;font-size:13.5px;color:var(--mu)}
.sets{display:flex;gap:6px;margin:10px 0 0 38px;flex-wrap:wrap;align-items:center}
.sd{width:38px;height:38px;border-radius:11px;border:2px solid var(--bd);background:var(--c2);font-weight:800}
.sd.on{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .3s}
.ld{display:flex;align-items:center;gap:8px;margin-left:auto}
.ld input{width:78px;padding:8px 10px;border-radius:11px;border:1px solid var(--bd);background:var(--c2);color:var(--tx);font-size:16px;font-weight:700}
.ld span{font-size:12px;color:var(--mu)}
.inf{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--bd);background:var(--c2);font-weight:800;color:var(--mu);flex:0 0 auto}
/* meals */
.ml{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--bd);align-items:flex-start}.ml:first-child{border-top:0;padding-top:0}
.ml .mi{font-size:22px;width:28px;text-align:center;flex:0 0 auto}
.ml h4{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase}.ml h4 small{color:var(--mu);font-weight:700;letter-spacing:0;text-transform:none;margin-left:6px}
.ml p{margin:3px 0 0;font-size:14.5px}.ml .k{font-size:12.5px;color:var(--mu);font-weight:700;margin-top:4px}
.ml.cur{background:rgba(232,89,12,.09);margin:0 -16px;padding:12px 16px;border-top-color:transparent}
.ml.dn p,.ml.dn h4{opacity:.55}
.nb{display:inline-block;background:var(--ac);color:#fff;border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:800;letter-spacing:.06em;margin-left:6px;vertical-align:1px}
.xr{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--bd);font-size:14px}.xr button{border:0;background:none;color:var(--mu);font-size:18px;padding:0 4px}
/* shop */
.it{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:11px 0;border-top:1px solid var(--bd);text-align:left;min-height:48px}.card .it:first-of-type{border-top:0}
.it .f1{font-weight:600}.it em{font-style:normal;color:var(--mu);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.it.on .f1,.it.on em{text-decoration:line-through;opacity:.45}
.cat{margin:18px 0 6px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:800}
.seg{display:flex;background:var(--c2);border:1px solid var(--bd);border-radius:14px;padding:4px;margin:12px 0;gap:4px}
.seg button{flex:1;border:0;background:none;color:var(--mu);font-weight:800;font-size:14px;padding:9px 6px;border-radius:10px;min-height:40px}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* journey */
.nv{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px}.nv b{font-size:16px}
.nv button{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-size:18px;font-weight:800}
.nv button:disabled{opacity:.35}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:var(--c2);border:1px solid var(--bd);border-radius:14px;padding:12px}
.st small{display:block;color:var(--mu);font-size:11.5px;font-weight:700;letter-spacing:.04em}.st b{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em;margin-top:2px;font-variant-numeric:tabular-nums}.st em{font-style:normal;font-size:12px;color:var(--mu);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;color:var(--mu);font-weight:800;text-align:center;padding-bottom:2px}
.cal .c{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--trk);border:0;color:var(--tx);padding:0}
.cal .c.e{background:transparent}.cal .c.t{outline:2px solid var(--tx);outline-offset:-2px}.cal .c.fu{opacity:.35}
.lg{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--mu);margin-top:10px;justify-content:flex-end}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:2px;overflow-x:auto;padding-bottom:4px}
.hm i{width:9px;height:9px;border-radius:2px;background:var(--trk)}
.brk{display:grid;gap:12px}.brk .row b{font-size:14.5px}.brk .row span{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.lvb{display:flex;align-items:center;gap:14px}
.lvb .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,var(--gd) 14%,var(--card));border:1px solid color-mix(in srgb,var(--gd) 30%,var(--bd))}
details{margin-top:4px}summary{cursor:pointer;font-weight:800;font-size:14px;color:var(--ac);list-style:none;padding:4px 0}summary::-webkit-details-marker{display:none}
/* nav */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0));width:calc(100% - 20px);max-width:540px;display:flex;background:rgba(11,31,58,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px;padding:6px;z-index:8;box-shadow:0 10px 30px rgba(0,0,0,.25)}
nav button{flex:1;background:none;border:0;color:#8FA3BF;font-weight:700;font-size:10.5px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:16px;min-height:52px;position:relative}
nav svg{width:22px;height:22px}
nav button.on{color:#fff;background:rgba(255,255,255,.1)}
nav button.on::after{content:"";position:absolute;top:4px;right:calc(50% - 16px);width:6px;height:6px;border-radius:50%;background:var(--ac)}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(5,10,20,.55);display:none;align-items:flex-end;justify-content:center;z-index:30}.sheet.on{display:flex;animation:fd .2s}
.sheet>div{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0));max-height:88vh;overflow:auto;animation:su .28s cubic-bezier(.2,.8,.2,1)}
.sheet>div::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:var(--bd);margin:0 auto 12px}
.sheet h2{margin:0 0 4px;font-size:22px;letter-spacing:-.01em}
.sheet h4{margin:18px 0 8px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.fl{display:block;margin:12px 0}.fl span{display:block;font-size:13px;font-weight:700;color:var(--mu);margin-bottom:6px}
.fl input,.fl textarea,.fl select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--c2);color:var(--tx);font:inherit;font-size:16px}
.fl textarea{min-height:64px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);background:var(--c2);border-radius:12px;padding:9px 12px;font-weight:700;font-size:14px;min-height:42px}
.chip.on{background:var(--nv);border-color:var(--nv);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.he{display:flex;gap:8px;align-items:center;margin:6px 0}.he input{flex:1;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--c2);color:var(--tx);font:inherit}.he .ei{width:52px;flex:0 0 52px;text-align:center}
.he button{width:42px;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--c2);font-size:18px}
/* focus + auth */
.fo{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;padding:env(safe-area-inset-top,0) 18px calc(18px + env(safe-area-inset-bottom,0));max-width:560px;margin:0 auto}.fo.on{display:flex}
.fh{display:flex;align-items:center;gap:12px;padding:14px 0}
.dots{flex:1;display:flex;gap:4px}.dots i{flex:1;height:6px;border-radius:9px;background:var(--trk)}.dots i.p{background:var(--ok)}.dots i.c{background:var(--ac)}
.fc{flex:1;display:flex;flex-direction:column;justify-content:center;animation:sl .3s both}
.fc h1{font-size:32px;line-height:1.1;margin:10px 0;letter-spacing:-.02em}
.fc .sd{width:54px;height:54px;border-radius:16px;font-size:18px}
.fc .ld input{width:130px;font-size:24px;padding:10px 12px}
.fb{display:flex;gap:10px}.fb .btn{margin:0}.fb .btn.g{flex:0 0 auto;width:auto;padding:14px 18px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0));transform:translateX(-50%) translateY(20px);background:#0B1F3A;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:40}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:24px 12px;color:var(--mu)}.empty b{display:block;font-size:34px;margin-bottom:6px}
.demo{background:var(--am);color:#1a1200;text-align:center;font-weight:800;font-size:12.5px;padding:6px}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes sl{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes su{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fd{from{opacity:0}to{opacity:1}}
main>section,main>.also,main>.ex{animation:up .35s both}
main>:nth-child(2){animation-delay:.03s}main>:nth-child(3){animation-delay:.06s}main>:nth-child(4){animation-delay:.09s}main>:nth-child(n+5){animation-delay:.12s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sem{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:11px 13px;font-size:14px;margin:10px 0 0;border:1px solid var(--bd)}
.sem.g{background:rgba(31,157,85,.10)}.sem.y{background:rgba(227,160,8,.15)}.sem.r{background:rgba(232,89,12,.13)}

info:[{h:"Regole per arrivare fresco",l:["Gambe pesanti solo il martedì. Mercoledì zero gambe. Nessun esercizio nuovo con forte eccentrica nelle 72 h prima della gara.","Velocità prima del carico: nelle alzate di forza e potenza fermati quando la velocità cala sensibilmente (circa 15-20%), non quando «fa male».","Semaforo del giorno: Verde = scheda piena. Giallo (sonno sotto 6 h o DOMS 4/10 o più) = una serie in meno per esercizio e RIR +1. Rosso = solo mobilità e camminata.","Settimane con coppa + campionato: volume −30/−40% (togli l’ultima serie di ogni esercizio), mantieni l’intensità.","Scarico ogni 4ª settimana: −40% serie, RIR 4, stesso calendario.","Sonno 7,5-9 h: è il tuo miglior integratore.","Se un dolore articolare dura più di 48 h (spalla, ginocchio, adduttori): fermati su quell’esercizio e fallo vedere a un fisioterapista."]},
{h:"Tecnica «1 serie da 30»",l:["Solo su isolamenti a basso costo neurale (curl, pushdown, alzate laterali). Mai su Trap Bar, trazioni, panca o salti.","Non dimezzare alla lettera: se con 12 rip. usi 20 kg, per 30 rip. serve circa il 60-65% (12-13 kg). Le ultime 3-4 rip. devono rallentare (RIR 2-3).","Una serie da 30 non equivale a 3 serie da 12: è un compromesso per stare nei 60’. Se hai tempo, 2×20 è meglio."]},
{h:"Postura da programmatore",l:["Micro-reset ogni 90’ seduto (2’): chin tuck 5×5”; pull-apart con elastico 10; pettorale alla porta 30” per lato; 5 estensioni toraciche sulla sedia.","Postazione: bordo del monitor ad altezza occhi, tastiera vicina, gomiti a 90°; alzati e cammina ogni ora.","Quotidiano (5’): chin tuck contro il muro 2×10 con tenuta 5”; dead bug o respirazione diaframmatica 2’.","Test: distanza occipite-muro ogni 4 settimane; l’obiettivo è ridurla."]},
{h:"Controllo",l:["Ogni mattina: peso a digiuno dopo il bagno; conta la media settimanale.","Ogni 2 settimane: vita all’ombelico, stesso punto, a fine espirazione.","Ogni 4 settimane: CMJ, stima 5RM Trap Bar, trazioni massime pulite, distanza occipite-muro, foto.","Obiettivo: forza e salto stabili o in crescita mentre peso e vita scendono. Se forza e salto calano, aumenta le kcal prima di toccare il volume."]},
{h:"Realismo",l:["Il miglior portiere si costruisce soprattutto in campo: tecnica, lettura, reattività. La palestra dà potenza, robustezza e prevenzione degli infortuni.","Vincoli: max 2 sedute in palestra (la seconda facoltativa), 60 minuti al massimo, elastici 10-50 kg a casa, dieta invariata (cambiano solo le kcal, se servono).","Questo protocollo non sostituisce il parere di un medico o di un fisioterapista."]}],

const LS=[
{t:"La dicotomia del controllo",i:"Il cuore dello stoicismo: separa ciò che dipende da te (giudizi, scelte, azioni, impegno) da ciò che non dipende da te (risultato, meteo, arbitro, opinioni altrui). La serenità nasce dal mettere tutta l’energia nella prima colonna.",p:"Davanti a ogni fastidio di oggi chiediti: dipende da me? Se no, lascialo andare; se sì, agisci."},
{t:"Giudizi, non fatti",i:"Un evento è neutro finché non ci aggiungi un’etichetta. «Ho perso» è un fatto; «è una tragedia» è un giudizio. Lo stoico allena lo spazio tra ciò che accade e ciò che pensa.",p:"Scrivi un fatto che ti ha infastidito, poi riscrivilo togliendo ogni aggettivo."},
{t:"Le quattro virtù",i:"Saggezza (vedere le cose come sono), coraggio (fare ciò che è giusto anche quando costa), giustizia (agire bene verso gli altri), temperanza (misura in tutto). Per gli stoici sono l’unico vero bene.",p:"Scegli una delle quattro e cerca un’occasione concreta per praticarla prima di sera."},
{t:"Premeditatio malorum",i:"Immaginare in anticipo ciò che può andare storto toglie all’imprevisto il suo potere di sorprenderti. Non è pessimismo: è preparazione.",p:"Prima di un impegno importante, immagina 2 ostacoli possibili e come risponderai."},
{t:"L’esame serale",i:"Seneca ogni sera ripercorreva la giornata: cosa ho fatto bene? dove ho sbagliato? cosa posso migliorare? Senza processi, con lo sguardo di un buon allenatore.",p:"Stasera completa l’esame serale nell’app. Sii onesto e gentile con te stesso."},
{t:"Memento mori",i:"Ricordare che il tempo è limitato non è cupo: rende preziosa ogni giornata e toglie peso alle cose futili.",p:"Fai una cosa importante che stai rimandando. Oggi, non «quando avrò tempo»."},
{t:"Amor fati",i:"Non solo accettare ciò che accade, ma amarlo come materiale per crescere. Un infortunio, una sconfitta, un imprevisto: tutto può diventare allenamento del carattere.",p:"Pensa a una difficoltà recente e trova un modo in cui ti sta rendendo più forte."},
{t:"La visione dall’alto",i:"Marco Aurelio immaginava di guardare la Terra dall’alto: città, folle, dispute minuscole. Allargare lo sguardo ridimensiona ansie e orgoglio.",p:"Quando qualcosa ti agita, chiudi gli occhi per 30 secondi e guarda la scena dall’alto."},
{t:"Il disagio volontario",i:"Seneca consigliava di vivere ogni tanto con pochissimo, per scoprire che ciò che temiamo è sopportabile. Chi si allena al disagio non ne è schiavo.",p:"Scegli un piccolo disagio: doccia fredda finale, niente caffè, scale invece dell’ascensore."},
{t:"La clausola di riserva",i:"Lo stoico agisce con tutto l’impegno ma aggiunge: «se nulla lo impedisce». Ti tieni l’intenzione, lasci andare la pretesa sul risultato.",p:"Davanti ai piani di oggi aggiungi mentalmente: «se nulla lo impedisce»."},
{t:"L’ostacolo è la via",i:"Ciò che blocca l’azione diventa occasione per un’altra virtù: se non posso vincere, posso essere paziente; se non posso allenarmi, posso recuperare bene.",p:"Prendi l’ostacolo più fastidioso di oggi e chiediti quale virtù ti permette di allenare."},
{t:"Il tempo è l’unica cosa nostra",i:"Per Seneca tutto ci è prestato tranne il tempo, eppure è ciò che regaliamo più facilmente a chiunque. Custodirlo è un atto di rispetto verso se stessi.",p:"Individua un ladro di tempo (app, notifiche, abitudine) e limitalo oggi."},
{t:"Rispondere, non reagire",i:"L’ira è una follia breve. Il rimedio più grande è il rinvio: lascia passare l’onda prima di parlare o agire.",p:"Se ti senti irritato, conta fino a 10 e rispondi solo dopo un respiro lungo."},
{t:"I cerchi di Ierocle",i:"Immagina cerchi concentrici: tu, famiglia, amici, concittadini, umanità. Lo stoico prova ad avvicinare i cerchi esterni al centro: tratta gli estranei come vicini.",p:"Fai un gesto gentile per qualcuno fuori dalla tua cerchia stretta."},
{t:"Il modello interiore",i:"Gli stoici si chiedevano: come agirebbe qui Catone, o Socrate? Avere un modello rende le scelte più chiare e alza l’asticella.",p:"Scegli il tuo modello e consultalo in una decisione di oggi."},
{t:"Temperanza a tavola",i:"Il cibo è uno dei primi terreni per allenare la misura. Musonio Rufo: mangia per nutrirti, non per il piacere della gola. La dieta diventa pratica di carattere.",p:"Rispetta le porzioni del piano oggi e mangia un pasto senza schermi, con attenzione."},
{t:"Il corpo come strumento",i:"Musonio insegnava che la fatica fisica tempra anche l’anima: sopportare freddo, caldo e sforzo allena coraggio e costanza. L’allenamento è filosofia praticata.",p:"Nell’ultimo sforzo di oggi, mantieni la qualità anche quando costa."},
{t:"Il presente basta",i:"Il passato non c’è più, il futuro non c’è ancora: puoi agire solo ora. Concentrati sul compito che hai davanti, fatto bene.",p:"Scegli un compito e fallo con attenzione totale, senza saltare ad altro."},

const BASICS=`<p>Lo stoicismo è una filosofia pratica nata ad Atene con Zenone (circa 300 a.C.) e vissuta a Roma da Seneca, Epitteto e Marco Aurelio. Non è un insieme di idee da sapere, ma un <b>allenamento quotidiano del carattere</b>, come la palestra lo è per il corpo.</p>
<h4>I tre pilastri</h4><p><b>1. Controllo.</b> Separa ciò che dipende da te (giudizi, scelte, azioni) da ciò che non dipende da te. Investi solo nella prima parte.<br><b>2. Virtù.</b> L’unico vero bene è agire con saggezza, coraggio, giustizia e temperanza. Tutto il resto è secondario.<br><b>3. Natura.</b> Accetta il corso degli eventi (amor fati) e vivi da membro di una comunità più grande.</p>
<h4>La giornata dello stoico</h4><p><b>Mattino</b>: preparati alla giornata e leggi la lezione.<br><b>Durante il giorno</b>: fermati sulle impressioni prima di reagire; pratica l’esercizio del giorno.<br><b>Sera</b>: esame serale, cioè tre domande, due minuti, nessun processo.</p>
<h4>Come usare questo percorso</h4><p>Ogni giorno trovi una lezione nuova (ciclo di 30 lezioni) con una pratica concreta. Spunta «Pratica stoica del giorno» quando l’hai fatta e chiudi la giornata con l’esame serale. Il punteggio del Percorso tiene conto anche di questo.</p>`;

 `<h4>Storico</h4>`+(Object.keys(st.ts).sort().reverse().slice(0,6).map(k=>`<div class="sm" style="padding:6px 0;border-top:1px solid var(--bd)"><b>${pd(k).getDate()} ${MN[pd(k).getMonth()].slice(0,3)}</b> · ${T.list.filter(x=>st.ts[k][x.id]!=null).map(x=>esc(x.n)+" "+n1(st.ts[k][x.id])+" "+x.u).join(" · ")}</div>`).join("")||`<p class="sm mu">Nessun test ancora.</p>`)+`<button class="btn" onclick="tsSave()">Salva i test</button>`)}
function tsSave(){const ds=iso(today()),o={};document.querySelectorAll(".tsi").forEach(i=>{const v=parseFloat(i.value.replace(",","."));if(v>0)o[i.dataset.k]=v});if(Object.keys(o).length)st.ts[ds]=o;else delete st.ts[ds];sv();closeS();toast("Test salvati ✓");rd()}
function lesS(i){const l=LS[i];sheet(`<div class="ey" style="color:var(--gd)">Lezione ${i+1} di ${LS.length}</div><h2 style="font-family:'Iowan Old Style',Palatino,Georgia,serif">${l.t}</h2><p>${l.i}</p><div class="pr"><b>Pratica di oggi</b>${l.p}</div><h4>Come diventare stoico</h4>${BASICS}<button class="btn" onclick="closeS()">Ho capito</button>`)}
function setS(sec){const p=PL(),pr0=prof||{sport:true,team:[1,4],match:0},D=[1,2,3,4,5,6,0],th=st.set.th||"auto",custom=typeof st.plan=="object"&&st.plan;
 sheet(`<h2>Impostazioni</h2>
<h4 id="s-pl">Il mio piano</h4><div class="card" style="margin:0;padding:12px 14px"><b>${esc(p.name)}</b><div class="xs mu">${custom?"Piano personale importato":"Modello incluso nell’app"}</div></div>
<div class="two"><label class="btn g sm" style="cursor:pointer">📥 Importa piano<input type="file" accept=".json,application/json" style="display:none" onchange="plImp(this)"></label><button class="btn g sm" onclick="plExp()">⬇︎ Esporta piano</button></div>
<div class="chips" style="margin-top:10px"><button class="chip ${st.plan=="gk"?"on":""}" onclick="plSet('gk')">🧤 Elite GK</button><button class="chip ${st.plan=="base"?"on":""}" onclick="plSet('base')">📚 Piano base</button></div>
${p.weeks?`<label class="fl"><span>Inizio del programma (${p.weeks} settimane)</span><input type="date" value="${st.set.ps}" onchange="if(this.value){st.set.ps=iso(mon(pd(this.value)));sv();draw(1)}"></label>`:""}
${p.gk?`<p class="sm b" style="margin:14px 0 6px">Calendario squadra</p><label class="row" style="margin:6px 0"><input type="checkbox" ${pr0.sport?"checked":""} onchange="pp(this.checked)" style="width:22px;height:22px"><b>Pratico futsal</b></label>`+(pr0.sport?`<p class="sm mu" style="margin:10px 0 6px">Allenamenti di squadra (max 2)</p><div class="chips">`+D.map(d=>`<button class="chip ${pr0.team.includes(d)?"on":""}" onclick="pt2(${d})">${GD[d]}</button>`).join("")+`</div><p class="sm mu" style="margin:12px 0 6px">Partita</p><div class="chips">`+[-1,...D].map(d=>`<button class="chip ${pr0.match==d?"on":""}" onclick="pm(${d})">${d<0?"Nessuna":GD[d]}</button>`).join("")+`</div><p class="xs mu">Palestra A e B, primer e reset si riposizionano da soli.</p>`:"")
:""}
<h4>Orari</h4><label class="fl"><span>Orario abituale di allenamento</span><input type="time" value="${st.set.tt}" onchange="st.set.tt=this.value||'18:30';sv();draw(1)"></label>
${p.work?`<p class="sm b" style="margin:6px 0">Lavoro (micro-reset ogni ${p.work.every}’)</p><div class="two"><label class="fl"><span>Inizio</span><input type="time" value="${st.set.wf}" onchange="st.set.wf=this.value||'09:00';sv();draw(1)"></label><label class="fl"><span>Fine</span><input type="time" value="${st.set.wt}" onchange="st.set.wt=this.value||'18:00';sv();draw(1)"></label></div><div class="chips">${D.map(d=>`<button class="chip ${(st.set.wd||[]).includes(d)?"on":""}" onclick="wdT(${d})">${GD[d]}</button>`).join("")}</div>`:""}
${p.shop?`<p class="sm mu" style="margin:14px 0 6px">Giorno della spesa settimanale</p><div class="chips">${D.map(d=>`<button class="chip ${st.set.sd==d?"on":""}" onclick="st.set.sd=${d};sv();setS();draw(1)">${GD[d]}</button>`).join("")}</div>`:""}
${p.focus?`<h4>Obiettivo principale</h4><div class="two"><label class="fl"><span>Nome</span><input value="${esc(p.focus.n)}" maxlength="24" onchange="plEdit(x=>x.focus.n=this.value||'Studio')"></label><label class="fl"><span>Minuti al giorno</span><input type="number" inputmode="numeric" value="${p.focus.goal}" onchange="plEdit(x=>x.focus.goal=Math.max(10,parseInt(this.value)||60))"></label></div>`:""}
<h4>Premio</h4>${p.reward?`<div class="two"><label class="fl"><span>Premio</span><input value="${esc(p.reward.ic+" "+p.reward.n)}" maxlength="30" onchange="plEdit(x=>{const v=this.value.trim().split(' ');x.reward.ic=v.length>1?v.shift():'🎁';x.reward.n=v.join(' ')||'Premio'})"></label><label class="fl"><span>Si sblocca a (punti)</span><input type="number" inputmode="numeric" value="${p.reward.min}" onchange="plEdit(x=>x.reward.min=Math.min(100,Math.max(30,parseInt(this.value)||70)))"></label></div><button class="btn g sm" onclick="plEdit(x=>x.reward=null);setS()">Rimuovi il premio</button>`:`<button class="btn g sm" onclick="plEdit(x=>x.reward={n:'Premio',ic:'🎁',min:70});setS()">＋ Aggiungi un premio giornaliero</button>`}
<h4 id="s-hb">Abitudini</h4><div id="hbe">`+st.hb.map((x,i)=>`<div class="he"><input class="ei" value="${esc(x.i)}" maxlength="4" onchange="st.hb[${i}].i=this.value||'•';sv();draw(1)" aria-label="Icona"><input value="${esc(x.n)}" maxlength="44" onchange="st.hb[${i}].n=this.value||'Abitudine';sv();draw(1)" aria-label="Nome"><button onclick="st.hb.splice(${i},1);sv();setS('hb');draw(1)" aria-label="Elimina">×</button></div>`).join("")+`</div><div class="he"><input class="ei" id="nhi" value="✳️" maxlength="4"><input id="nhn" placeholder="Nuova abitudine" maxlength="44"><button onclick="hbAdd()" aria-label="Aggiungi">＋</button></div>
${p.meals?`<h4>Calorie</h4><label class="fl"><span>Obiettivo giornaliero (0 = automatico dal piano)</span><input type="number" inputmode="numeric" value="${st.set.kt||0}" onchange="st.set.kt=Math.max(0,parseInt(this.value)||0);sv();draw(1)"></label>`:""}
<h4>Aspetto</h4><div class="chips">${[["auto","Automatico"],["light","Chiaro"],["dark","Scuro"]].map(([k,l])=>`<button class="chip ${th==k?"on":""}" onclick="st.set.th='${k}';theme();sv();setS()">${l}</button>`).join("")}</div>
<h4>Dati</h4><button class="btn g sm" onclick="exp()">⬇︎ Esporta tutti i miei dati (JSON)</button>${me?`<button class="btn g sm" onclick="out()">Esci (${esc(me.username)})</button>`:""}
<button class="btn" onclick="closeS()">Fatto</button>`);
 if(sec){const e=$("s-"+sec);e&&setTimeout(()=>e.scrollIntoView({block:"start"}),50)}}
function wdT(d){const a=st.set.wd||(st.set.wd=[]),i=a.indexOf(d);if(i>=0)a.splice(i,1);else a.push(d);sv();setS();draw(1)}
function hbAdd(){const n=$("nhn").value.trim();if(!n)return;st.hb.push({id:"h"+Date.now().toString(36),n:n.slice(0,44),i:$("nhi").value||"✳️"});sv();setS("hb");draw(1)}
function dl(name,obj){const b=new Blob([JSON.stringify(obj,null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}
function exp(){dl("elitegk-dati-"+iso(today())+".json",st)}
function plExp(){const p=clone(PL());p.habits=clone(st.hb);dl("piano-"+(p.id||"personale")+".json",p)}
/* modifica il piano: un modello incluso viene copiato nel piano personale */
function plEdit(fn){if(typeof st.plan!="object"||!st.plan)st.plan=clone(PL());fn(st.plan);sv();draw(1)}
function plSet(id){if(st.plan&&!confirmS(id))return;st.plan=id;st.hb=clone(TPL[id].habits);build();sv();closeS();toast("Piano attivato ✓");go("t")}
function confirmS(id){return typeof st.plan!="object"||window.__plOk||(window.__plOk=1,toast("Tocca di nuovo per sostituire il piano personale"),false)}
function plValid(p){return p&&typeof p=="object"&&typeof p.name=="string"&&(p.sessions||p.meals||p.habits||p.focus)}
function plImp(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);if(!plValid(p))throw 0;
 p.w=p.w||{wo:30,m:25,hb:20,sl:15,j:10,fo:p.focus?30:0};p.ex=p.ex||{};p.sessions=p.sessions||{};p.week=p.week||{};p.gk=0;
 st.plan=p;if(Array.isArray(p.habits)&&p.habits.length)st.hb=clone(p.habits);if(p.weeks)st.set.ps=iso(mon(today()));build();sv();closeS();toast("Piano importato: "+p.name);go("t")}catch(e){toast("File non valido: serve un piano .json")}};r.readAsText(f)}
function theme(){const t=st.set.th;if(t=="light"||t=="dark")document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme}
const lp=()=>{try{localStorage.setItem("egkp",JSON.stringify(prof))}catch(e){}};
function pv2(){lp();build();if(me)api("profile","PUT",prof);setS("pl");draw(1)}
function pp(v){prof=prof||{sport:true,team:[1,4],match:0};prof.sport=v;pv2()}
function pt2(d){prof=prof||{sport:true,team:[1,4],match:0};const t=prof.team,i=t.indexOf(d);if(i>=0)t.splice(i,1);else{t.push(d);if(t.length>2)t.shift()}if(prof.match==d)prof.match=-1;pv2()}
function pm(d){prof=prof||{sport:true,team:[1,4],match:0};prof.match=d;prof.team=prof.team.filter(x=>x!=d);pv2()}

/* ---------- modalità focus allenamento ---------- */
let fi=0,fx=[],fds="",tmr=null;
function fstart(ds){fds=ds||iso(today());fx=exOf(pd(fds),fds);if(!fx.length)return;const g=L(fds);if(!g.ws){g.ws=Date.now();sv()}fi=Math.max(0,fx.findIndex(e=>!(g.e&&g.e[e.id])));$("fo").classList.add("on");document.body.classList.add("lock");fs()}
function fq(){clearInterval(tmr);$("fo").classList.remove("on");document.body.classList.remove("lock");rd()}
function fn(){const g=L(fds);g.e=g.e||{};g.e[fx[fi].id]=1;sv();buzz();fi++;fs()}
function fb(){if(fi>0){fi--;fs()}}
function rt(b,sec){clearInterval(tmr);let s=sec||90;b.textContent="⏱ "+s+"”";tmr=setInterval(()=>{s--;b.textContent=s>0?"⏱ "+s+"”":"✔ Via!";if(s<=0){clearInterval(tmr);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}},1000)}
const recS=r=>{if(!r)return 90;const m=/(\d+)’(?:(\d+)”)?/.exec(r);if(m)return(+m[1])*60+(+(m[2]||0));const s=/(\d+)”/.exec(r);return s?+s[1]:90};
function fs(){clearInterval(tmr);const e=fx[fi],g=G(fds),S=ses(pd(fds),fds),p=PL();
 if(!e){const m=g.m&&g.m.l;$("fo").innerHTML=`<div class="fc" style="text-align:center"><div style="font-size:64px">🔥</div><h1>Allenamento completato</h1><p class="mu">${S.post&&p.meals?"Ora il post-sessione: "+esc(p.meals.fix.l[0])+".":"Ottimo lavoro. Recupera bene."}</p>${S.post&&p.meals&&!m?`<button class="btn" onclick="tm('${fds}','l');fs()">🥛 Fatto ✓</button>`:""}<button class="btn g" onclick="fq()">Chiudi</button></div>`;return}
 const id=e.id,n=nSets(e.d),bm=(g.s&&g.s[id])||0,pvL=prevLoad(id,fds),cur=st.lg[id]&&st.lg[id][fds],rs=recS(e.rec);
 $("fo").innerHTML=`<div class="fh"><button class="ib" onclick="fq()" aria-label="Chiudi">✕</button><div class="dots">${fx.map((_,i)=>`<i class="${i<fi?"p":i==fi?"c":""}"></i>`).join("")}</div><b>${fi+1}/${fx.length}</b></div>
<div class="fc"><div class="ey">${esc(e.h)}${e.ss?" · superset "+esc(e.ss):""}</div><span class="tg" style="align-self:flex-start;font-size:15px;padding:3px 10px;margin-top:8px">${esc(e.d)}</span><h1>${esc(e.n)}</h1><p class="mu" style="margin:0">${esc(e.no)}</p>${fds==iso(today())?semBox(fds):""}
${n>1?`<div class="sets" style="margin:22px 0 0">${Array.from({length:n},(_,i)=>`<button class="sd ${bm&(1<<i)?"on":""}" onclick="ss('${fds}','${id}',${i},${n})">${i+1}</button>`).join("")}</div>`:""}
${e.ld?`<div class="ld" style="margin:18px 0 0"><input type="number" inputmode="decimal" step="0.5" placeholder="${pvL??"kg"}" value="${cur??""}" onchange="sLoad('${fds}','${id}',this.value)" aria-label="Carico in kg"><span>kg${pvL!=null?" · ultimo "+pvL:""}</span></div>`:""}
<button class="lk" style="align-self:flex-start;margin-top:16px" onclick="inf('${id}')">▶ Come si esegue</button></div>
<div class="fb"><button class="btn g" onclick="fb()" aria-label="Indietro">←</button><button class="btn g" onclick="rt(this,${rs})">⏱ ${e.rec?esc(e.rec):"90”"}</button><button class="btn" onclick="fn()">Fatto · avanti</button></div>`}

/* ---------- navigazione e disegno ---------- */
const TABS=[["t","Oggi","home"],["w","Allenamento","gym"],["m","Dieta","food"],["p","Spesa","cart"],["j","Percorso","path"]];
function nav(){$("nav").innerHTML=TABS.map(([k,l,i])=>`<button class="${tab==k?"on":""}" onclick="go('${k}')" aria-current="${tab==k?"page":"false"}">${IC[i]}${l}</button>`).join("")}
function draw(keep){$("v").innerHTML=!hasPlan()?vWelcome():tab=="t"?vToday():tab=="w"?vWork():tab=="m"?vDiet():tab=="p"?vShop():vPath();if(!keep)scrollTo(0,0);
 if(tab=="m"&&!keep&&iso(selDate())==iso(today()))setTimeout(()=>{const n=document.querySelector(".ml.cur");n&&n.scrollIntoView({block:"center",behavior:"smooth"})},120)}
let lastDay=iso(today());
setInterval(()=>{if(document.hidden||$("sh").classList.contains("on")||$("fo").classList.contains("on"))return;const d=iso(today());if(d!=lastDay){lastDay=d;sel=new Date().getDay()}if(tab=="t")rd()},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&tab=="t"&&!$("sh").classList.contains("on"))rd()});

/* ---------- account e sincronizzazione ---------- */
const api=(p,m="GET",b)=>fetch("/api/"+p,{method:m,headers:b?{"content-type":"application/json"}:{},body:b?JSON.stringify(b):undefined,credentials:"same-origin"}).then(async r=>({ok:r.ok,s:r.status,d:await r.json().catch(()=>({}))}));
function start(){build();theme();$("au").classList.remove("on");nav();draw()}
async function boot(){theme();try{const r=await api("me");if(r.ok){me=r.d.user;prof=r.d.profile;const s=r.d.state;
  if(s&&Object.keys(s).length)st=mig(s,me.username=="gaetano"||s.d||s.l?"gk":null);
  else{st=fresh(me.username=="gaetano"?"gk":null);api("state","PUT",st)}
  lp();try{localStorage.setItem("egk",JSON.stringify(st))}catch(e){}start();return}if(r.s==401){authUI();return}}catch(e){}start()}
function authUI(m="login"){const Lg=m=="login";$("au").classList.add("on");$("au").innerHTML=`<div class="fc"><span class="tg" style="align-self:flex-start">ELITE GK</span><h1>${Lg?"Bentornato":"Inizia il percorso"}</h1><p class="mu" style="margin:0 0 18px">${Lg?"Accedi per riprendere i tuoi progressi.":"Crea il tuo account: ognuno ha il suo piano, le sue abitudini e i suoi progressi."}</p><label class="fl"><span>Utente</span><input id="u" autocapitalize="none" autocomplete="username"></label><label class="fl"><span>Password</span><input id="p" type="password" placeholder="minimo 8 caratteri" autocomplete="${Lg?"current-password":"new-password"}" onkeydown="if(event.key=='Enter')doAuth('${m}')"></label>`+(Lg?"":`<label class="row sm" style="margin:6px 0"><input type="checkbox" id="spo" style="width:20px;height:20px"> Gioco a futsal (calendario squadra e partita)</label>`)+`<p id="er" class="sm" style="color:var(--ac);min-height:1.4em"></p><button class="btn" onclick="doAuth('${m}')">${Lg?"Entra":"Registrati"}</button><button class="btn g" onclick="authUI('${Lg?"reg":"login"}')">${Lg?"Crea un account":"Ho già un account"}</button></div>`}
async function doAuth(m){const r=await api(m=="login"?"login":"register","POST",{u:$("u").value,p:$("p").value,sport:$("spo")?$("spo").checked:true});if(r.ok){if(m=="reg"){try{localStorage.removeItem("egk");localStorage.removeItem("egkp")}catch(e){}st=fresh(null)}else{try{localStorage.removeItem("egk")}catch(e){}}boot()}else $("er").textContent=r.d.e||"Errore, riprova"}
async function out(){await api("logout","POST");try{localStorage.clear()}catch(e){}location.reload()}
if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
boot();
</script></body></html>
